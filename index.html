<!DOCTYPE html>
<!-- ^ Говорит браузеру: "это HTML5". Должно быть первой строкой, без пробелов перед. -->

<html lang="ru">
<!-- ^ Начало страницы. lang="ru" — язык русский (для поисковиков, экранных читалок). -->

<head>
  <!-- ^ Служебный блок. Здесь то, что НЕ видно на странице: заголовок вкладки, кодировка, стили. -->

  <meta charset="utf-8">
  <!-- ^ Кодировка UTF-8. Без неё русские буквы превратятся в кракозябры. -->

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ^ Чтобы на телефоне страница выглядела нормально, а не как увеличенный в 10 раз десктоп. -->

  <title>Ryzhkauskas</title>
  <!-- ^ Надпись на вкладке браузера. Не заголовок страницы, а именно вкладка. -->

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23FFCC00'/><text x='16' y='25' font-family='Helvetica,Arial,sans-serif' font-size='26' font-weight='bold' text-anchor='middle' fill='%23000'>R</text></svg>">
  <!-- ^ Иконка на вкладке: оранжевый круг, чёрная R без засечек, крупная. -->

  <link rel="stylesheet" href="style.css">
  <!-- ^ Подключает файл стилей style.css из той же папки. Здесь живут все цвета, шрифты, отступы. -->
</head>
<!-- ^ Конец служебного блока. -->

<body>
  <!-- ^ Начало видимой части страницы. Всё, что здесь — видит пользователь. -->

  <h1>Chaos City</h1>
  <!-- ^ Заголовок первого уровня. Обычно на странице один такой. Оформление задаётся в style.css в правиле h1. -->

  <p>Привет. Это мой вебзин. Про город, его обитателей и, конечно, про его закоулки. Стены, холсты и надписи в парадных и на чёрных лестницах. </p>
  <!-- ^ <p> — абзац (paragraph). Каждый абзац оборачивайте в <p></p>. -->

  <p class="nav">
    <a href="city.html">город</a> ·
    <a href="pictures.html">картинки</a> ·
    <a href="tales.html">байки</a>
  </p>
  <!-- ^ Три ссылки-раздела. class="nav" — метка для CSS, чтобы оформить именно этот абзац. -->

  <img src="images/pervomayskaya.png" alt="Первомайская ТЭЦ">
  <!-- ^ Картинка. src — путь к файлу (папка images рядом с index.html).
       alt — текст-описание: показывается если картинка не загрузится и читается
       программами для слабовидящих. Одиночный тег, закрывать не надо. -->

  <hr>
  <!-- ^ Горизонтальная линия-разделитель. Одиночный тег.
       Смысл: "тема закончилась, дальше другое". Оформление — в style.css. -->

  <p class="copyright"><small>© Jarosh Ryzhkauskas 2026</small></p>
  <!-- ^ class="copyright" — метка для CSS, чтобы оформить именно этот абзац.
       <small> — мелкий текст. Оформление класса .copyright — в style.css. -->

</body>
<!-- ^ Конец видимой части. -->

</html>
<!-- ^ Конец страницы. -->
